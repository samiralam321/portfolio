<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./profile.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Samir Alam - Backend Developer & Competitive Programmer</title>
    <meta name="description" content="Portfolio of Samir Alam, Backend Developer, AI & GenAI Learner, and Competitive Programmer." />
    <!-- Preload hero banner for instant rendering without black flicker -->
    <link rel="preload" as="image" href="/images/portfolio-landscape.webp" fetchpriority="high" type="image/webp" />
    <!-- Google Fonts: Inter and Instrument Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0 !important;
        padding: 0 !important;
      }
      body {
        font-family: 'Inter', sans-serif !important;
      }
      .font-instrument {
        font-family: 'Instrument Serif', Georgia, serif;
      }
    </style>
  </head>
  <body class="min-h-screen m-0 p-0 bg-[#fafafa] dark:bg-[#121212] text-neutral-900 dark:text-[#F2F2F2] font-sans antialiased selection:bg-neutral-900 selection:text-white dark:selection:bg-white dark:selection:text-black">
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
    <script>
      // Apply theme before page loads to avoid flicker
      (function() {
        var theme = localStorage.getItem('theme') || 'light';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </body>
</html>

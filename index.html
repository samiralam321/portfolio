<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./profile.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Samir Alam - Backend Developer & Competitive Programmer</title>
    <meta name="description" content="Portfolio of Samir Alam, Backend Developer, AI & GenAI Learner, and Competitive Programmer." />
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif !important;
      }
    </style>
  </head>
  <body class="min-h-screen bg-background font-sans antialiased max-w-2xl mx-auto py-12 sm:py-24 px-6 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
    <script>
      // Apply theme before page loads to avoid flicker
      (function() {
        var theme = localStorage.getItem('theme') || 'light';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </body>
</html>
